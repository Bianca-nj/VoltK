<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VoltKenya — Demo</title>
  <style>
    /* ---- Root & variables ---- */
    :root{
      --green-600: #1e8f3b;
      --green-700: #19833a;
      --muted: #9aa4a6;
      --surface: #f6f7f8;
      --card: #ffffff;
      --accent: #e6f6e9;
      --border: #e6e8e9;
      --shadow: 0 6px 18px rgba(20,30,30,0.06);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #1f2933;
    }

    /* ---- Basic layout ---- */
    body{
      margin:0;
      background: linear-gradient(180deg, #fbfcfc, #f3f5f6);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    header{
      background: linear-gradient(180deg,var(--green-600),var(--green-700));
      color:white;
      padding: 20px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow: 0 6px 18px rgba(16,64,32,0.08);
    }

    .brand{
      display:flex;
      gap:14px;
      align-items:center;
    }
    .logo{
      width:44px;
      height:44px;
      border-radius:8px;
      background: linear-gradient(135deg,#ffd54a,#ffb74d);
      display:grid;
      place-items:center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      font-weight:800;
      color:#2b2b2b;
      transform: rotate(-8deg);
      font-size:20px;
    }
    .brand h1{
      margin:0;
      font-size:22px;
      letter-spacing:0.6px;
    }
    .brand p{
      margin:0;
      font-size:13px;
      opacity:0.95;
      color: rgba(255,255,255,0.9);
    }

    .header-actions{
      display:flex;
      gap:14px;
      align-items:center;
    }
    .btn-refresh{
      background: white;
      color: var(--green-700);
      padding:10px 16px;
      border-radius:12px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:none;
      font-weight:600;
      cursor:pointer;
      box-shadow: var(--shadow);
    }

    main.container{
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 20px 80px;
      display:grid;
      grid-template-columns: 1fr 420px;
      gap: 28px;
      align-items:start;
    }

   
    /* ---- Stations list placeholder ---- */
    .stations{
      margin-top:22px;
      display:grid;
      gap:14px;
    }
    .station{
      background: linear-gradient(180deg,#ffffff,#fafcfa);
      border-radius:12px;
      padding:14px;
      border:1px solid #eef1f1;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .station .left{
      display:flex;
      gap:14px;
      align-items:center;
    }
    .station .icon{
      width:44px;
      height:44px;
      border-radius:10px;
      background: #f0f9f4;
      display:grid;
      place-items:center;
      font-weight:700;
      color:var(--green-700);
    }
    .station h3{margin:0;font-size:15px;}
    .station p{margin:0;color:var(--muted);font-size:13px}

    /* ---- Payment panel ---- */
    .payment-panel{
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow);
      border:1px solid var(--border);
      position:sticky;
      top:28px;
      height:fit-content;
    }
    .panel-title{font-weight:700;margin:0 0 8px 0;font-size:18px}
    .panel-sub{color:var(--muted);margin:0 0 18px 0;font-size:13px}
    .amount-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }
    .amount-card {
  cursor: pointer;
  transition: all 0.3s ease;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 15px;
  background: #f5f5f5;
  text-align: center;
  font-weight: 500;
}

.amount-card:hover {
  transform: scale(1.05);
  background: #eaf7ef;
}

.amount-card.selected {
  background: #d4f5dc;
  border-color: #1a7e36;
  transform: scale(1.08);
  box-shadow: 0 0 10px rgba(26, 126, 54, 0.3);
}


    .custom-row{margin-top:18px}
    .input-with-prefix{
      display:flex;
      gap:0;
      align-items:center;
      border-radius:12px;
      overflow:hidden;
      border:1px solid var(--border);
      background: #fff;
    }
    .prefix{
      padding:12px 14px;
      background: var(--accent);
      font-weight:700;
      color: var(--green-700);
      min-width:72px;
      text-align:center;
    }
    .input-with-prefix input{
      border:0;
      padding:12px 14px;
      font-size:15px;
      outline:none;
      width:100%;
    }

    .field-label{display:block;margin:14px 0 8px 0;font-weight:600;color:#243131;font-size:14px}

    /* ---- Footer action ---- */
    .pay-actions{
      margin-top:18px;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .btn-primary{
      padding:14px 0px;
      border-radius:12px;
      background: var(--green-600);
      color:white;
      border:0;
      font-weight:700;
      cursor:pointer;
      width: 100%;
      font-size: 12px;
    }
    .btn-primary:hover {
  background: #1a7e36;
  box-shadow: 0 0 10px rgba(30, 143, 59, 0.4);
}

    
    .btn-back {
  background: white;
  color: var(--green-700);
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: background 0.2s;
}
.btn-back:hover {
  background: var(--accent);
}

/* --- Custom amount and kWh row --- */
.enhanced-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: #fff;
  padding-right: 500px;
}

.amount-input {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 0;
}

.amount-input .prefix {
  padding: 12px 14px;
  background: var(--accent);
  font-weight: 700;
  color: var(--green-700);
  min-width: 72px;
  text-align: center;
  border-right: 1px solid var(--border);
}

.amount-input input {
  border: 0;
  outline: none;
  padding: 12px 14px;
  font-size: 15px;
  width: 100%;
  color: #2b3b3b;
}

.kwh-display {
  min-width: 90px;
  text-align: right;
  font-weight: 600;
  color: var(--green-700);
  font-size: 15px;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.kwh-display:not(:empty) {
  opacity: 1;
  transform: translateX(0);
}

.kwh-display:empty {
  opacity: 0;
  transform: translateX(-4px);
}


    /* ---- Responsive ---- */
    @media (max-width: 980px){
      main.container{
        grid-template-columns: 1fr;
        padding-bottom: 60px;
      }
      .payment-panel{ position:relative; top:auto; }
    }

    @media (max-width:520px){
      .amount-grid{ grid-template-columns: 1fr; }
      .brand h1{font-size:18px}
      .logo{width:40px;height:40px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>VOLTKENYA</h1>
        <p>Power Your Journey</p>
      </div>
    </div>

    <div class="header-actions">
  <button class="btn-back" onclick="window.location.href='index.html'">⬅ Back</button>
</div>

  </header>

      <!-- blank space / content area -->
    
      <div style="background:transparent;border-radius:12px;padding:8px;">
      </div>

      <div class="stations">
  <div class="station" data-id="1">
    <div class="left">
      <div class="icon">⚡</div>
      <div>
        <h3>Station 1</h3>
        <p>Server 1</p>
      </div>
    </div>
    <span class="status" style="font-weight:600; color:green;">Active</span>
  </div>
</div>

    </section>
<h3 id="selectedPort" style="margin-bottom: 12px; color:#19833a; margin-left: 10px;"></h3>
    <!-- Right: Payment Panel -->
    <aside>
      <div class="payment-panel" aria-labelledby="payment-heading">
        
        <h2 class="panel-title" id="payment-heading">Select Charging Amount</h2>
        <p class="panel-sub">KSh 40 per kWh • Minimum: KSh 50</p>

        <div class="amount-grid" id="amountGrid" role="list">
          <div class="amount-card" role="listitem" data-value="100">
            <h4>KSh 100</h4>
            <p>2 kWh</p>
          </div>

          <div class="amount-card" role="listitem" data-value="200">
            <h4>KSh 200</h4>
            <p>5 kWh</p>
          </div>

          <div class="amount-card" role="listitem" data-value="500">
            <h4>KSh 500</h4>
            <p>12.5 kWh</p>
          </div>

          <div class="amount-card" role="listitem" data-value="1000">
            <h4>KSh 1000</h4>
            <p>20 kWh</p>
          </div>
        </div>

     <div class="custom-row">
  <label class="field-label">Or enter custom amount</label>
  <div class="input-with-prefix enhanced-row">
    <div class="amount-input">
      <div class="prefix">KSh</div>
      <input id="customAmount" type="number" min="50" placeholder="Enter amount" />
    </div>
    <div id="calculatedKwh" class="kwh-display"></div>
  </div>
</div>

<div id="paymentPopup" style="
  display:none; 
  position:fixed; 
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6);
  justify-content:center; 
  align-items:center;
  z-index:9999;
">
  <div style="
    background:white;
    padding:2rem;
    border-radius:1rem;
    text-align:center;
    max-width:320px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
  ">
    <h3 style="color:green;">✅ Payment Successful!</h3>
    <p>Your payment has been recorded. Charging will begin shortly.</p>
    <button id="doneBtn" style="
      background:green;
      color:white;
      border:none;
      padding:0.6rem 1.5rem;
      border-radius:0.5rem;
      margin-top:1rem;
      cursor:pointer;
    ">Done</button>
  </div>
</div>



        <div class="phone-row">
          <label class="field-label">M-Pesa Phone Number</label>
          <div class="input-with-prefix" style="margin-bottom:8px;">
            <div class="prefix">+254</div>
            <input id="mpesaPhone" type="tel" inputmode="tel" placeholder="712345678" maxlength="9" />
          </div>
        </div>

        <div class="pay-actions">
          <button onclick="addPayment()" class="btn-primary" id="payBtn">Pay</button>
        </div>
      </div>
    </aside>
  </main>

  <script>
const selectedPort = JSON.parse(localStorage.getItem('selectedStation'));
const amountCards = document.querySelectorAll('.amount-card');
const customAmount = document.getElementById('customAmount');
const mpesaPhone = document.getElementById('mpesaPhone');
const payBtn = document.getElementById('payBtn');
const kwhInfo = document.getElementById('calculatedKwh');
let selectedAmount = null;

// Change this if your backend is on a different host/port
const apiBase = "http://localhost:5000/api/payments";

window.addEventListener('DOMContentLoaded', () => {
  const portDisplay = document.getElementById('selectedPort');
  if (selectedPort) {
    portDisplay.textContent = `Charging at: ${selectedPort.location} — Server ${selectedPort.server_port}`;
  } else {
    portDisplay.textContent = "No port selected ⚠️";
  }
});

amountCards.forEach(card => {
  card.addEventListener('click', () => {
    // Remove previous selection
    amountCards.forEach(c => c.classList.remove('selected'));
    // Highlight the clicked one
    card.classList.add('selected');
    
    // Get amount value
    selectedAmount = Number(card.dataset.value);
    
    // Update the input field so user sees it filled in
    customAmount.value = selectedAmount;
    
    // Show calculated kWh
    updateKwhDisplay(selectedAmount);
  });
});


customAmount.addEventListener('input', () => {
  amountCards.forEach(c => c.classList.remove('selected'));
  const v = Number(customAmount.value);
  selectedAmount = v > 0 ? v : null;
  updateKwhDisplay(v);
});

function updateKwhDisplay(amount) {
  if (amount >= 50) {
    const kwh = (amount / 40).toFixed(2);
    kwhInfo.textContent = `${kwh} kWh`;
  } else {
    kwhInfo.textContent = '';
  }
}

mpesaPhone.addEventListener('input', () => {
  mpesaPhone.value = mpesaPhone.value.replace(/\D/g, '').slice(0, 9);
});

async function addPayment() {
  const amount = selectedAmount || Number(customAmount.value);
  const phone = mpesaPhone.value;

  // --- Validation ---
  if (!amount || amount < 50) {
    alert('⚠️ Enter a valid amount (minimum KSh 50).');
    return;
  }

  if (!phone || phone.length !== 9) {
    alert('⚠️ Enter a valid 9-digit M-Pesa phone number (without country code).');
    return;
  }

  if (!selectedPort || !selectedPort.id) {
    alert('⚠️ No charging port selected.');
    return;
  }

  // --- Processing State ---
  payBtn.disabled = true;
  const origText = payBtn.textContent;
  payBtn.textContent = "Processing...";

  try {
    const payload = {
      port_id: selectedPort.id,
      amount,
      kwh: (amount / 40).toFixed(2),
      phone: `+254${phone}`,
      timestamp: new Date().toISOString(),
    };

    // --- Send payment to backend ---
    const response = await fetch("http://localhost:5000/api/payments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Payment failed");
    }

    console.log("Payment stored:", result);

    // --- Update station status to busy ---
    const stationEl = document.querySelector(`.station[data-id="${selectedPort.id}"] .status`);
    if (stationEl) {
      stationEl.textContent = "Busy";
      stationEl.style.color = "orange";
    }

    // --- Show Popup ---
    const popup = document.getElementById('paymentPopup');
    popup.style.display = 'flex';

    const doneBtn = document.getElementById('doneBtn');
    doneBtn.onclick = () => {
      window.location.href = 'index.html';
    };

  } catch (err) {
    console.error("Payment error:", err);
    alert("⚠️ Payment failed. Try again later.");
  } finally {
    payBtn.disabled = false;
    payBtn.textContent = origText;
  }
}



  </script>
</body>
</html>
