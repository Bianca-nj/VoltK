<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User</title>
  <style>
    :root {
      --green-600: #1e8f3b;
      --green-700: #19833a;
      --muted: #9aa4a6;
      --surface: #f6f7f8;
      --card: #ffffff;
      --accent: #e6f6e9;
      --border: #e6e8e9;
      --shadow: 0 6px 18px rgba(20,30,30,0.06);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #1f2933;
    }

    body {
      background: #f3f5f6;
      margin: 0;
    }

    header {
      background: linear-gradient(180deg,var(--green-600),var(--green-700));
      color:white;
      padding: 22px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow: 0 6px 18px rgba(16,64,32,0.08);
    }

    .brand {
      display:flex;
      gap:14px;
      align-items:center;
    }

    .logo {
      width:44px;
      height:44px;
      border-radius:8px;
      background: linear-gradient(135deg,#ffd54a,#ffb74d);
      display:grid;
      place-items:center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      font-weight:800;
      color:#2b2b2b;
      transform: rotate(-8deg);
      font-size:20px;
    }

    .brand h1 {
      margin:0;
      font-size:22px;
      letter-spacing:0.6px;
    }

    .brand p {
      margin:0;
      font-size:13px;
      opacity:0.95;
      color: rgba(255,255,255,0.9);
    }

    .search-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin: 40px auto;
      width: 80%;
      max-width: 600px;
    }

    .search-row {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #e6e9ea;
    }

    .search-input input {
      border: 0;
      outline: none;
      font-size: 15px;
      width: 100%;
      color: #2b3b3b;
    }

    .results {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .station-item {
      background: var(--accent);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .station-item:hover {
      background: var(--green-600);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1>VOLTKENYA</h1>
        
        <p>Power Your Journey</p>
      </div>
    </div>
  </header>

  <h1 style="text-align: center;">Hello 😊</h1>
  <p style="font-size: large; text-align: center;"><b>Kindly enter your location to access a charging port station near you</b></p>

  <div class="search-card">
    <div class="search-row">
      <div class="search-input">
        <span>🔍</span>
        <input id="searchInput" placeholder="Search stations by your location..." oninput="searchStations()" />
      </div>
    </div>

    
    <div id="results" class="results"></div>
  </div>

  <script>
    const apiBase = "http://localhost:5000/api/ports";

    async function searchStations() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const resultsContainer = document.getElementById("results");
      
      if (query.length < 2) {
        resultsContainer.innerHTML = "";
        return;
      }

      try {
        const res = await fetch(apiBase);
        const ports = await res.json();

        const filtered = ports.filter(p => p.location.toLowerCase().includes(query));

        if (filtered.length === 0) {
          resultsContainer.innerHTML = `<p style="color:#999;text-align:center;">No stations found near "${query}".</p>`;
          return;
        }

        resultsContainer.innerHTML = filtered.map(p => `
          <div class="station-item" onclick="selectStation(${p.id}, '${p.location}',  '${p.server_port}')">
            <div>
              <strong>${p.location}</strong><br>
              <small>${p.server_port}</small>
            </div>
            <span>➡️</span>
          </div>
        `).join("");
      } catch (err) {
        console.error("Error fetching stations:", err);
        resultsContainer.innerHTML = `<p style="color:red;text-align:center;">⚠️ Unable to load stations.</p>`;
      }
    }

    function selectStation(id, location, server_port) {
  // Fetch all ports from backend to check status
  fetch(apiBase)
    .then(res => res.json())
    .then(ports => {
      const port = ports.find(p => p.id === id);
      if (!port) {
        alert("⚠️ Port not found.");
        return;
      }

      if (port.status === "inactive") {
        alert(`⚠️ The selected port at "${port.location}" is inactive. Please choose another.`);
        return; // stop navigation
      }

      // Save selected station to localStorage
      localStorage.setItem("selectedStation", JSON.stringify({ id, location, server_port }));

      // Redirect to payment page
      window.location.href = "voltkenya.html";
    })
    .catch(err => {
      console.error("Error fetching ports:", err);
      alert("⚠️ Unable to verify port status. Try again.");
    });
}

  </script>

</body>
</html>
