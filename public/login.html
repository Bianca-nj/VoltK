<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f2f8f6;
      color: rgb(53, 111, 92);
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      margin-bottom: 1.5rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: rgb(53, 111, 92);
      box-shadow: 0 0 5px rgba(53, 111, 92, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: rgb(53, 111, 92);
      user-select: none;
      font-size: 0.9rem;
    }

    button {
      background-color: rgb(53, 111, 92);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
    }

    button:hover {
      background-color: rgb(43, 91, 77);
    }

    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="username" placeholder="Username" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>
      <button type="submit">Log In</button>
    </form>
    <div class="message" id="message"></div>

  <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee;">
        <a href="/index.html" style="
            display: block;
            padding: 10px;
            border-radius: 6px;
            border: 1.5px solid rgb(53, 111, 92);
            color: rgb(53, 111, 92);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
        "
        onmouseover="this.style.background='rgb(53,111,92)';this.style.color='white'"
        onmouseout="this.style.background='transparent';this.style.color='rgb(53,111,92)'">
            👤 Go to User Page
        </a>
    </div>
</div>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.querySelector(".toggle-password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        toggleIcon.textContent = "👁️";
      }
    }

    // Login using backend
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const message = document.getElementById('message');

      try {
        const res = await fetch('http://localhost:5000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          // Redirect to admin dashboard
          window.location.href = '/admin.html';
        } else {
          message.style.color = 'red';
          message.textContent = '❌ Invalid credentials';
        }

      } catch (err) {
        console.error(err);
        message.style.color = 'red';
        message.textContent = '⚠️ Login failed, check server connection.';
      }
    });
  </script>
</body>
</html>
